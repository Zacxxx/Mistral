service: buildshield-api
frameworkVersion: '4'

plugins:
  - serverless-esbuild
  - serverless-offline

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-west-3
  stage: ${opt:stage, 'dev'}
  environment:
    NODE_OPTIONS: --enable-source-maps

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    concurrency: 4

functions:
  health:
    handler: src/handlers/health.main
    events:
      - httpApi:
          method: GET
          path: /health

  quoteAnalyze:
    handler: src/handlers/quoteAnalyze.main
    events:
      - httpApi:
          method: POST
          path: /quotes/analyze
